[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentview"
version = "0.1.0"
description = "See the web the way an AI agent sees it — and measure where sites serve agents a different, sometimes poisoned, page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tushar Islampure", email = "tusharislampure@gmail.com" }]
keywords = ["ai-agents", "prompt-injection", "web-security", "llm", "cloaking", "ai-safety", "crawler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
agentview = "agentview.cli:main"

[project.urls]
Homepage = "https://github.com/tusharislampure29/agentview"

[tool.setuptools.packages.find]
include = ["agentview*"]
