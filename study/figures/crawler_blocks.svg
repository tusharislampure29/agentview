<rect x="250" y="162" width="337" height="30" rx="5" fill="#e8833a"/>
<text x="730" y="183" font-size="13" font-weight="600" fill="#1c2330">9.7%  (51/526)</text>
<text x="238" y="227" text-anchor="end" font-size="13" fill="#1c2330">ClaudeBot (Anthropic indexer)</text>
