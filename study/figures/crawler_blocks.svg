<text x="24" y="34" font-size="20" font-weight="700" fill="#1c2330">How often each AI crawler is blocked</text>
<text x="24" y="56" font-size="13" fill="#5b6472">share of sites that returned a 4xx/5xx to this crawler but not to a human</text>
