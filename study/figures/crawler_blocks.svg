<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="720" height="406" fill="white"/>
<text x="240" y="34" font-size="20" font-weight="700" fill="#1c2330">How often each AI crawler is blocked</text>
<text x="240" y="56" font-size="13" fill="#5b6472">share of sites that returned a 4xx/5xx to this crawler but not to a human</text>
<text x="228" y="95" text-anchor="end" font-size="13" fill="#1c2330">GPTBot (OpenAI indexer)</text>
