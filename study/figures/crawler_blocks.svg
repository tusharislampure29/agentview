<text x="730" y="95" font-size="13" font-weight="600" fill="#1c2330">13.5%  (71/526)</text>
<text x="238" y="139" text-anchor="end" font-size="13" fill="#1c2330">ChatGPT-User (OpenAI live fetch)</text>
